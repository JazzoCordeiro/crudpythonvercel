<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca - Leitores</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; padding: 24px; color: #222; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { margin-top: 0; }
    .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: flex; flex-direction: column; font-size: 14px; gap: 4px; }
    input, select { padding: 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    .acoes { grid-column: 1 / -1; display: flex; gap: 8px; }
    button { padding: 9px 16px; border: 0; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn-salvar { background: #2563eb; color: #fff; }
    .btn-cancelar { background: #e5e7eb; display: none; }
    .btn-editar { background: #f59e0b; color: #fff; }
    .btn-excluir { background: #dc2626; color: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    .tabela-wrap { overflow-x: auto; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 12px; }
    .ativo { background: #dcfce7; color: #166534; }
    .bloqueado { background: #fee2e2; color: #991b1b; }
    #msg { margin-bottom: 12px; padding: 10px; border-radius: 6px; display: none; }
    #msg.ok { background: #dcfce7; display: block; }
    #msg.erro { background: #fee2e2; display: block; }
    @media (max-width: 600px) { form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="container">
  <h1>📚 Cadastro de Leitores</h1>

  <div class="card">
    <div id="msg"></div>
    <form id="form-leitor">
      <input type="hidden" id="id_usuario">

      <label>Nome completo
        <input type="text" id="nome_completo" maxlength="150" required>
      </label>
      <label>Matrícula
        <input type="text" id="matricula" maxlength="40" required>
      </label>
      <label>Contato
        <input type="text" id="contato" maxlength="120" placeholder="E-mail ou telefone" required>
      </label>
      <label>Status
        <select id="status_cadastro" required>
          <option value="ativo">Ativo</option>
          <option value="bloqueado">Bloqueado</option>
        </select>
      </label>

      <div class="acoes">
        <button type="submit" class="btn-salvar" id="btn-salvar">Cadastrar</button>
        <button type="button" class="btn-cancelar" id="btn-cancelar">Cancelar edição</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2 style="margin-top:0">Leitores cadastrados</h2>
    <div class="tabela-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>Nome</th><th>Matrícula</th><th>Contato</th><th>Status</th><th>Ações</th></tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const API = "/api/leitores";
  const form = document.getElementById("form-leitor");
  const tabela = document.getElementById("tabela");
  const msg = document.getElementById("msg");
  const btnSalvar = document.getElementById("btn-salvar");
  const btnCancelar = document.getElementById("btn-cancelar");

  const campos = ["nome_completo", "matricula", "contato", "status_cadastro"];

  function mostrarMsg(texto, tipo) {
    msg.textContent = texto;
    msg.className = tipo;
    setTimeout(() => { msg.className = ""; msg.style.display = ""; }, 4000);
  }

  async function requisitar(url, opcoes) {
    const resp = await fetch(url, opcoes);
    const dados = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(dados.erro || "Erro na requisição.");
    return dados;
  }

  function criarCelula(texto) {
    const td = document.createElement("td");
    td.textContent = texto; // textContent evita injeção de HTML (XSS)
    return td;
  }

  async function carregar() {
    try {
      const leitores = await requisitar(API);
      tabela.innerHTML = "";
      leitores.forEach(l => {
        const tr = document.createElement("tr");
        tr.append(
          criarCelula(l.id_usuario),
          criarCelula(l.nome_completo),
          criarCelula(l.matricula),
          criarCelula(l.contato)
        );

        const tdStatus = document.createElement("td");
        const badge = document.createElement("span");
        badge.className = "badge " + l.status_cadastro;
        badge.textContent = l.status_cadastro;
        tdStatus.appendChild(badge);
        tr.appendChild(tdStatus);

        const tdAcoes = document.createElement("td");
        const bEditar = document.createElement("button");
        bEditar.className = "btn-editar";
        bEditar.textContent = "Editar";
        bEditar.onclick = () => editar(l);
        const bExcluir = document.createElement("button");
        bExcluir.className = "btn-excluir";
        bExcluir.textContent = "Excluir";
        bExcluir.onclick = () => excluir(l.id_usuario);
        tdAcoes.append(bEditar, " ", bExcluir);
        tr.appendChild(tdAcoes);

        tabela.appendChild(tr);
      });
    } catch (e) {
      mostrarMsg(e.message, "erro");
    }
  }

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const id = document.getElementById("id_usuario").value;
    const corpo = {};
    campos.forEach(c => corpo[c] = document.getElementById(c).value);

    try {
      await requisitar(id ? `${API}/${id}` : API, {
        method: id ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(corpo)
      });
      mostrarMsg(id ? "Leitor atualizado!" : "Leitor cadastrado!", "ok");
      resetar();
      carregar();
    } catch (e) {
      mostrarMsg(e.message, "erro");
    }
  });

  function editar(l) {
    document.getElementById("id_usuario").value = l.id_usuario;
    campos.forEach(c => document.getElementById(c).value = l[c]);
    btnSalvar.textContent = "Salvar alterações";
    btnCancelar.style.display = "inline-block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function excluir(id) {
    if (!confirm("Deseja realmente excluir este leitor?")) return;
    try {
      await requisitar(`${API}/${id}`, { method: "DELETE" });
      mostrarMsg("Leitor excluído!", "ok");
      carregar();
    } catch (e) {
      mostrarMsg(e.message, "erro");
    }
  }

  function resetar() {
    form.reset();
    document.getElementById("id_usuario").value = "";
    btnSalvar.textContent = "Cadastrar";
    btnCancelar.style.display = "none";
  }

  btnCancelar.addEventListener("click", resetar);
  carregar();
</script>
</body>
</html>
